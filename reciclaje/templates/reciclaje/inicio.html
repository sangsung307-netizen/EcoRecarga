{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoRecarga - Bienvenido</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #F4F6F0;
            color: #2D3729;
            font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .welcome-card {
            background-color: #FFFFFF;
            border: 1px solid #E2E8D8;
            border-radius: 16px;
            padding: 2.5rem 2rem;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .brand-title {
            color: #2D3729;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .brand-subtitle {
            color: #6B7C65;
            font-size: 0.9rem;
            font-style: italic;
        }
        .btn-ciudadano {
            background-color: #4A7C59;
            color: #FFFFFF;
            font-weight: 500;
            border: none;
            padding: 12px 16px;
            border-radius: 12px;
            text-decoration: none;
            display: block;
            width: 100%;
            transition: background-color 0.2s;
        }
        .btn-ciudadano:hover {
            background-color: #3D6749;
            color: #FFFFFF;
        }
        .btn-admin {
            background-color: #E9EDE5;
            color: #2D3729;
            font-weight: 500;
            border: none;
            padding: 12px 16px;
            border-radius: 12px;
            text-decoration: none;
            display: block;
            width: 100%;
            transition: background-color 0.2s;
        }
        .btn-admin:hover {
            background-color: #DFE5D8;
            color: #2D3729;
        }
        .register-text {
            color: #6B7C65;
            font-size: 0.9rem;
        }
        .register-link {
            color: #4A7C59;
            font-weight: 600;
            text-decoration: none;
        }
        .register-link:hover {
            text-decoration: underline;
            color: #3D6749;
        }
    </style>
</head>
<body>

    <div class="welcome-card">
        <div class="mb-4">
            <span class="fs-2 d-block mb-2">🌿</span>
            <h1 class="h3 brand-title mb-1">ECORECARGA</h1>
            <p class="brand-subtitle mb-0">"Recicla, acumula y gana por el planeta"</p>
        </div>

        <div class="d-grid gap-3 my-4">
            <a href="{% url 'login_ciudadano' %}" class="btn-ciudadano">
                Iniciar Sesión como Ciudadano
            </a>
            <a href="{% url 'login_admin' %}" class="btn-admin">
                Iniciar Sesión como Administrador
            </a>
        </div>

        <div class="register-text mt-3">
            ¿No tienes cuenta? 
            <a href="{% url 'registro' %}" class="register-link ms-1">Regístrate aquí</a>
        </div>
    </div>

</body>
</html>
