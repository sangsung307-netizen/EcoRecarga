{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoRecarga - Registro de Usuario</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #F4F6F0;
            color: #2D3729;
            font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .register-card {
            background-color: #FFFFFF;
            border: 1px solid #E2E8D8;
            border-radius: 16px;
            padding: 2.5rem 2rem;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .register-title {
            color: #2D3729;
            font-weight: 700;
        }
        .register-subtitle {
            color: #6B7C65;
            font-size: 0.9rem;
        }
        .form-label-custom {
            color: #2D3729;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0.35rem;
        }
        .form-control-custom {
            background-color: #F9FBF7;
            border: 1px solid #E2E8D8;
            border-radius: 12px;
            padding: 12px 16px;
            color: #2D3729;
        }
        .form-control-custom:focus {
            background-color: #F9FBF7;
            border-color: #4A7C59;
            color: #2D3729;
            box-shadow: 0 0 0 0.2rem rgba(74, 124, 89, 0.2);
        }
        .btn-registrarse {
            background-color: #4A7C59;
            color: #FFFFFF;
            font-weight: 500;
            border: none;
            padding: 12px 16px;
            border-radius: 12px;
            width: 100%;
            transition: background-color 0.2s;
        }
        .btn-registrarse:hover {
            background-color: #3D6749;
            color: #FFFFFF;
        }
        .nav-text {
            color: #6B7C65;
            font-size: 0.9rem;
        }
        .login-link {
            color: #4A7C59;
            font-weight: 600;
            text-decoration: none;
        }
        .login-link:hover {
            text-decoration: underline;
            color: #3D6749;
        }
        .back-link {
            color: #6B7C65;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
            color: #2D3729;
        }
    </style>
</head>
<body>

    <div class="register-card">
        <!-- Encabezado -->
        <div class="text-center mb-4">
            <span class="fs-2 d-block mb-1">🌱</span>
            <h1 class="h4 register-title mb-1">Crear Cuenta</h1>
            <p class="register-subtitle mb-0">Únete a EcoRecarga y comienza a ganar</p>
        </div>

        <!-- Formulario -->
        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label form-label-custom">Nombre Completo</label>
                <input type="text" name="nombre" required 
                    class="form-control form-control-custom" 
                    placeholder="Tu nombre">
            </div>

            <div class="mb-3">
                <label class="form-label form-label-custom">Correo Electrónico</label>
                <input type="email" name="email" required 
                    class="form-control form-control-custom" 
                    placeholder="tucorreo@ejemplo.com">
            </div>

            <div class="mb-4">
                <label class="form-label form-label-custom">Contraseña</label>
                <input type="password" name="password" required 
                    class="form-control form-control-custom" 
                    placeholder="••••••••">
            </div>

            <button type="submit" class="btn-registrarse">
                Registrarse
            </button>
        </form>

        <!-- Enlaces -->
        <div class="text-center mt-4 nav-text">
            <p class="mb-2">¿Ya tienes cuenta? <a href="{% url 'login_ciudadano' %}" class="login-link ms-1">Inicia sesión</a></p>
            <p class="mb-0"><a href="{% url 'inicio' %}" class="back-link">← Volver al inicio</a></p>
        </div>
    </div>

</body>
</html>
